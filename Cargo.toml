[package]
name = "flock-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fly88oj/flock-protocol"
description = "Cryptographic protocol library for Flock VPN: hybrid X25519+ML-KEM-768 KEM, Noise-IK-style 1-RTT tunnel sessions, file envelopes v1/v2, OPAQUE PAKE, SR-SIG1 signatures, yamux multiplexing, compression tiers, and TOFU/invite trust anchors."
readme = "README.md"
keywords = ["vpn", "cryptography", "kem", "noise", "protocol"]
categories = ["cryptography", "network-programming"]

# cdylib: the .wasm artifact surface for the wasm32 target (M8b
# webauth_shim's C-ABI exports require crate-type to include cdylib for
# a .wasm file to be produced; wasm-bindgen-style crates do the same).
# rlib stays primary — downstream dependents' linking is unaffected; the
# extra unconsumed cdylib unit in native builds is only produced when
# building explicitly with `-p flock-protocol`.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
aes-gcm = "0.11.1"
ed25519-dalek = "3.0.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
ml-kem = "0.3.3"
sha2 = "0.11.1"
sha2_compat = { package = "sha2", version = "0.10" }
hkdf = "0.13.0"
rand = "0.9"
# ml-kem 0.3.3 uses the rand_core 0.10 generation (a different generation
# from rand 0.9's rand_core 0.9); the library adapts via a private bridge
# (src/kem.rs), keeping the public RNG surface uniformly rand 0.9.
rand_core = "0.10"
base64 = "0.22"
hex = "0.4"
rsa = { version = "0.9.10", optional = true }
opaque-ke = { version = "4.0.1", default-features = false, features = ["ristretto255"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
# The zstd tier is optional (feature `zstd`, on by default): zstd-sys
# carries C sources; cross-compiling to wasm32 needs clang. In
# environments without a C toolchain (e.g. the rust:1-bookworm
# container), default-features can be disabled to compile the core
# protocol surface (lz4_flex is pure Rust and always available). A wasm
# consumer declaring default-features=false gets exactly this shape.
zstd = { version = "0.14.3", optional = true }
lz4_flex = "0.14"
# session/mux batch (§1.3.3c/§1.3.3d /§3.5/§3.6)
yamux = "0.14.1"
chacha20poly1305 = "0.11.0"
aes-gcm-siv = "0.12.1"
futures = "0.3"
# M7 roster batch (§7-M7.4/§7-M7.7): control-plane shared-contract
# message wire formats (same types on both ends, pure data with no
# platform surface).
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
# Deterministic zeroization of key material (design §1.3.3c
# "reject_after zeroes keys on trigger" commitment):
# TrafficKeys/DirKeys/SealedShared, handshake k1/k_enc, and the KEM
# combine ikm.
zeroize = "1.9"

# wasm32: tokio net does not support this target (tokio's Cargo.toml
# restricts socket2 to non-wasm); the session/mux library code uses only
# io-util/time/sync/rt/macros. Native builds still take the full set
# (including net).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["io-util", "time", "sync", "rt", "macros"] }
# getrandom custom backend (the rustflags cfg in .cargo/config.toml):
# the bridge is src/wasm_bridge.rs. Two generations coexist: 0.3 (the
# rand 0.9 generation) via the extern symbol; 0.2 (rand_core 0.6 ← the
# opaque-ke path) via the register_custom_getrandom! macro — one entropy
# pool serves both.
getrandom = "0.3"
getrandom02 = { package = "getrandom", version = "0.2", features = ["custom"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "macros", "rt-multi-thread"] }
# bench (§7-M1): criterion 0.8 (aes-gcm reuses the regular dependency)
criterion = "0.8"

[[bench]]
name = "aead"
harness = false

[features]
# The zstd tier is on by default (full behavior unchanged); consumers
# with default-features=false (wasm builds) that disable it explicitly
# get a compress module with only the pure-Rust lz4 tier, and wasm32
# builds with zero C dependencies.
default = ["zstd"]
zstd = ["dep:zstd"]
# —— feature split per docs/design.md §1.3.1 ——
# Default (no named feature) = the full VPN tier: sig / kem (hybrid KEM) /
# envelope v2 / pake / compress / session / mux. The trust module joins
# the default tier in later milestone batches.
# Envelope v1 (RSA-OAEP) read-only compatibility: transitional use, off
# by default.
# rsa/sha2: Oaep::new::<Sha256> needs a sha2 0.10 digest type of the same
# generation as rsa (re-exported via rsa::sha2).
legacy = ["dep:rsa", "rsa/sha2"]
# OPAQUE server-identity signature layer (P0-5 login anchor): enabled in
# the main-repository build, off by default (placeholder only in this
# batch).
anchor = []
# ML-DSA-65 parallel public-key tier (P2-12): ml-dsa 0.1.1 is unaudited
# (crypto-2026 §5), off by default (placeholder only in this batch).
pq-sign = []
# wasm build constraints (getrandom custom-backend bridge
# src/wasm_bridge.rs): off by default.
wasm = []

# With the standalone repository there is no workspace-root [profile.*]
# inheritance — the original workspace-root values are kept in place
# (the 8MiB aes-gcm test: -O0 0.61s vs -O1 0.013s, 46×; the bench gate
# needs LTO thin to reclaim cross-crate inlining losses, see
# showroom-analysis §3).
[profile.test]
opt-level = 1

[profile.bench]
lto = true
codegen-units = 1

# Prevents a parent directory from accidentally discovering this crate
# into some workspace (standalone-repository form).
[workspace]
