name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-14, macos-15]
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      - name: cargo test (--all-features)
        run: cargo test --all-features

      - name: cargo check (--no-default-features)
        run: cargo check --no-default-features

  wasm-and-lints:
    name: wasm32 + clippy + fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm32-unknown-unknown target
        run: rustup target add wasm32-unknown-unknown

      # wasm32 走 --no-default-features --features wasm：zstd 档关闭（zstd-sys 含 C 源，
      # 交叉需 clang），仅 lz4 纯 Rust 档，零 C 依赖。getrandom custom 后端 cfg 由
      # .cargo/config.toml 的 rustflags 提供，无需额外环境。
      - name: cargo check (wasm32, --no-default-features --features wasm)
        run: cargo check --no-default-features --features wasm --target wasm32-unknown-unknown

      - name: cargo clippy (--all-features, -D warnings)
        run: cargo clippy --all-features -- -D warnings

      - name: cargo fmt (--check)
        run: cargo fmt --all -- --check
