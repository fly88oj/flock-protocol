name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      - name: cargo test (--all-features)
        run: cargo test --all-features

      - name: cargo check (--no-default-features)
        run: cargo check --no-default-features

  wasm-and-lints:
    name: wasm32 + clippy + fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm32 target and lint components
        # The rustup auto-install triggered by rust-toolchain.toml does not
        # include clippy/rustfmt (minimal profile)
        run: rustup target add wasm32-unknown-unknown && rustup component add clippy rustfmt

      # wasm32 goes --no-default-features --features wasm: the zstd tier is
      # off (zstd-sys carries C sources; cross-compiling needs clang),
      # leaving only the pure-Rust lz4 tier with zero C dependencies. The
      # getrandom custom-backend cfg comes from the rustflags in
      # .cargo/config.toml; no extra environment needed.
      - name: cargo check (wasm32, --no-default-features --features wasm)
        run: cargo check --no-default-features --features wasm --target wasm32-unknown-unknown

      - name: cargo clippy (--all-features, -D warnings)
        run: cargo clippy --all-features -- -D warnings

      - name: cargo fmt (--check)
        run: cargo fmt --all -- --check
