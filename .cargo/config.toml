# wasm32-unknown-unknown: getrandom has no default backend for this
# target (the js feature needs wasm-bindgen, which is forbidden) — use
# the "custom" backend, whose callback is provided inside the crate by
# flock_protocol::wasm_bridge::__getrandom_v03_custom (the
# getrandom-0.3.4 src/backends/custom.rs contract). Applies to this
# target only; native builds are unaffected.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"custom\""]
